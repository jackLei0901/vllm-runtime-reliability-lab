[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-runtime-dfx-lab"
version = "0.1.0a2"
description = "Bounded external incident recording and fault-injection lab for vLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
authors = [{name = "Yuan Lei"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]

[project.urls]
Repository = "https://github.com/jackLei0901/vllm-runtime-reliability-lab"
Issues = "https://github.com/jackLei0901/vllm-runtime-reliability-lab/issues"

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "ruff>=0.8"]

[project.scripts]
vllm-dfx = "dfxlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/vllm-runtime-reliability-lab/schema" = ["schema/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
