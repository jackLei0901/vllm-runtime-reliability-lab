[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-runtime-dfx-lab"
version = "0.2.0"
description = "Bounded external incident recording and fault-injection lab for vLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
authors = [{name = "Yuan Lei"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]

[project.urls]
Repository = "https://github.com/jackLei0901/vllm-runtime-reliability-lab"
Issues = "https://github.com/jackLei0901/vllm-runtime-reliability-lab/issues"

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "ruff>=0.8"]

[project.scripts]
vllm-dfx = "dfxlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/vllm-runtime-reliability-lab/schema" = ["schema/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  # Published evidence: preserve byte identity with the filed upstream issue.
  "experiments/pytorch-unused-grad-dtype/upstream_dtype_issue/PYTORCH_ISSUE_BODY_READY.md",
  "experiments/pytorch-unused-grad-dtype/upstream_dtype_issue/PYTORCH_ISSUE_DRAFT.md",
  "experiments/pytorch-unused-grad-dtype/upstream_dtype_issue/reproducer.py",
  # Immutable Stage 0 evidence: its SHA-256 is checked by the verifier.
  "experiments/vllm-zmq-event-backpressure/stage0_backpressure_executed.py",
  # Pre-execution freeze verifiers are byte-pinned by their manifests.
  "experiments/vllm-zmq-event-backpressure/verify_stage1_freeze.py",
  "experiments/vllm-zmq-event-backpressure/verify_stage1_r2_freeze.py",
  # Published PR #36451 evidence pins these executed runners by SHA-256.
  "experiments/vllm-zmq-event-backpressure/current_version_ping_audit.py",
  "experiments/vllm-zmq-event-backpressure/current_version_ping_cell.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
