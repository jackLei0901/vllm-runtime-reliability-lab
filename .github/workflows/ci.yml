name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run engine binding CPU controls
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s experiments/vllm-engine-binding-gate -p test_binding_evidence.py -v
          python -m unittest discover -s experiments/vllm-engine-binding-gate -p test_cpu_contract.py -v
      - name: Compile source
        run: python -m compileall -q src tests
      - name: CLI smoke test
        run: vllm-dfx --help

  release-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel from the checked-out commit
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel into a clean environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          .release-venv/bin/python -c "import importlib.metadata as m, pathlib, tomllib, dfxlab; expected = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert m.version('vllm-runtime-dfx-lab') == dfxlab.__version__ == expected"
      - name: Replay the published result without GPU dependencies
        run: |
          . .release-venv/bin/activate
          vllm-dfx replay results/vllm-zmq-backpressure-stage1-r3-20260916
